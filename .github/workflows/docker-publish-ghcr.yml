name: Publish Docker Images to GHCR

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    name: Publish Docker image - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-api
            context: user-api
            dockerfile: Dockerfile

          - service: product-api
            context: product-api
            dockerfile: Dockerfile

          - service: order-api
            context: order-api
            dockerfile: Dockerfile

          - service: delivery-estimator-api
            context: delivery-estimator-api
            dockerfile: Dockerfile

          - service: fraud-detector-api
            context: fraud-detector-api
            dockerfile: Dockerfile

          - service: payment-service
            context: payment-service
            dockerfile: src/main/docker/Dockerfile.jvm

          - service: notification-service
            context: notification-service
            dockerfile: src/main/docker/Dockerfile.jvm

          - service: ai-chat-bff
            context: ai-chat-bff
            dockerfile: src/main/docker/Dockerfile.jvm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package service before Docker build
        working-directory: ${{ matrix.context }}
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw -B clean package -DskipTests
          else
            mvn -B clean package -DskipTests
          fi

      - name: Prepare image metadata
        id: image
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE="ghcr.io/${OWNER}/ecommerce-${{ matrix.service }}"

          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          echo "Image: ${IMAGE}"
          echo "Tags: latest, sha-${SHORT_SHA}"

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --file "${{ matrix.context }}/${{ matrix.dockerfile }}" \
            --tag "${{ steps.image.outputs.image }}:latest" \
            --tag "${{ steps.image.outputs.image }}:sha-${{ steps.image.outputs.short_sha }}" \
            "${{ matrix.context }}"

      - name: Push Docker image
        run: |
          docker push "${{ steps.image.outputs.image }}:latest"
          docker push "${{ steps.image.outputs.image }}:sha-${{ steps.image.outputs.short_sha }}"
